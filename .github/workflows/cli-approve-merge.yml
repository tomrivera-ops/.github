# faraday-ci-bot gated merge (FARADAY-CI-BOT-HARDENING-001).
#
# Founder-dispatched only. Refuses unless scripts/merge_gate.py ALLOWs the exact
# head SHA: the complete required check set at that head, a clean Codex receipt and
# review state at that head, independent review evidence at that head from a
# distinct allowlisted reviewer, and an unexpired founder SSH signature over the
# exact decision (repository, PR, head SHA, base SHA, method, policy version, expiry).
# Policy mode (Faraday Review A0/A1) is disabled: the gate refuses any other mode.
#
# Token safety:
#   * workflow_dispatch only; the gate job runs only from main and only when both
#     github.actor and github.triggering_actor are the founder;
#   * the gate job mints a READ-ONLY token scoped to the one target repository;
#   * the merge job (environment faraday-merge) mints a contents/pull_requests write
#     token scoped to the one repository, only after the gate ALLOWs, and merges with
#     sha=<head> so GitHub rejects the merge if the head moved;
#   * no approval is submitted (ADR-0012), no --admin, no PR code is checked out,
#     and inputs reach scripts only through environment variables;
#   * KILL-SWITCH (default: refuse): both jobs are skipped unless repository variable
#     FARADAY_BOT_MERGE_ENABLED == 'true', and merge_gate.py also refuses unless
#     policy activation.enabled is true and the governing ADR (ADR-0014) is Accepted.
#     ADR-0012 section 1 forbids any bot merge until that ADR is ratified;
#   * every Python step runs isolated (python3 -I), so repository files can never
#     shadow the standard library; the gate refuses to run without it.
name: CLI Approve & Merge

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "Org owning the repo (e.g. tomrivera-ops)"
        required: true
        type: string
      repo:
        description: "Repository name or owner/name"
        required: true
        type: string
      pr_number:
        description: "PR number"
        required: true
        type: string
      head_sha:
        description: "Exact 40-hex head SHA being merged"
        required: true
        type: string
      base_sha:
        description: "Exact 40-hex default-branch tip the decision is bound to"
        required: true
        type: string
      expires_at:
        description: "Decision expiry, UTC YYYY-MM-DDTHH:MM:SSZ (at most policy grant.max_ttl_hours ahead)"
        required: true
        type: string
      mode:
        description: "founder only (a signed founder decision is the sole authority)"
        required: true
        default: founder
        type: choice
        options: [founder]
      merge_method:
        description: "squash | merge | rebase"
        required: true
        default: squash
        type: choice
        options: [squash, merge, rebase]
      founder_signature:
        description: "base64 of the armored founder SSH signature over the v2 decision (namespace faraday-merge-go)"
        required: true
        type: string

permissions: {}

concurrency:
  group: faraday-merge-${{ inputs.owner }}-${{ inputs.repo }}-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      vars.FARADAY_BOT_MERGE_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'tomrivera-PSE' &&
      github.triggering_actor == 'tomrivera-PSE'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Same environment as the merge job, so the App key can live only in
    # environment secrets (deployment branch: main) and nowhere org-wide.
    environment: faraday-merge
    permissions:
      contents: read
    outputs:
      repo_name: ${{ steps.validate.outputs.repo_name }}
      adr_repo: ${{ steps.validate.outputs.adr_repo }}
      decision_sha256: ${{ steps.evaluate.outputs.decision_sha256 }}
    env:
      IN_OWNER: ${{ inputs.owner }}
      IN_REPO: ${{ inputs.repo }}
      IN_PR: ${{ inputs.pr_number }}
      IN_SHA: ${{ inputs.head_sha }}
      IN_BASE_SHA: ${{ inputs.base_sha }}
      IN_EXPIRES_AT: ${{ inputs.expires_at }}
      IN_MODE: ${{ inputs.mode }}
      IN_METHOD: ${{ inputs.merge_method }}
      IN_ACTIVATION: ${{ vars.FARADAY_BOT_MERGE_ENABLED }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate inputs (before any token exists)
        id: validate
        run: |
          python3 -I scripts/merge_gate.py validate > validated.json
          python3 -I -c "import json;v=json.load(open('validated.json'));print('repo_name='+v['repo']+'\nadr_repo='+v['adr_repo'])" >> "$GITHUB_OUTPUT"

      - name: Mint read-only token for the target repository
        id: read-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ secrets.FARADAY_APP_ID }}
          private-key: ${{ secrets.FARADAY_APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}
          repositories: ${{ steps.validate.outputs.repo_name }},${{ steps.validate.outputs.adr_repo }}
          permission-contents: read
          permission-pull-requests: read
          permission-checks: read
          permission-statuses: read
          permission-issues: read

      - name: Collect evidence
        env:
          GATE_READ_TOKEN: ${{ steps.read-token.outputs.token }}
        run: python3 -I scripts/merge_gate.py collect --evidence evidence.json

      - name: Evaluate merge gate
        id: evaluate
        env:
          IN_SIGNATURE: ${{ inputs.founder_signature }}
        run: |
          python3 -I scripts/merge_gate.py evaluate --evidence evidence.json --decision decision.json
          echo "decision_sha256=$(sha256sum decision.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          {
            echo "### faraday-ci-bot merge gate: ALLOW"
            echo '```json'
            cat decision.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: merge-gate-${{ github.run_id }}
          path: |
            validated.json
            decision.json
          if-no-files-found: ignore
          retention-days: 90

  merge:
    needs: gate
    if: vars.FARADAY_BOT_MERGE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: faraday-merge
    permissions: {}
    env:
      IN_OWNER: ${{ inputs.owner }}
      IN_REPO_NAME: ${{ needs.gate.outputs.repo_name }}
      IN_PR: ${{ inputs.pr_number }}
      IN_SHA: ${{ inputs.head_sha }}
      IN_BASE_SHA: ${{ inputs.base_sha }}
      IN_EXPIRES_AT: ${{ inputs.expires_at }}
      IN_DECISION_SHA256: ${{ needs.gate.outputs.decision_sha256 }}
      IN_METHOD: ${{ inputs.merge_method }}
      IN_MODE: ${{ inputs.mode }}
      IN_REPO: ${{ inputs.repo }}
      IN_ACTIVATION: ${{ vars.FARADAY_BOT_MERGE_ENABLED }}
      GATE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Mint read-only token for the live pre-merge re-check
        id: recheck-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ secrets.FARADAY_APP_ID }}
          private-key: ${{ secrets.FARADAY_APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}
          repositories: ${{ github.event.repository.name }},${{ needs.gate.outputs.adr_repo }},${{ needs.gate.outputs.repo_name }}
          permission-contents: read
          permission-pull-requests: read

      - name: Re-check live (kill switch, policy version, expiry, PR head/base) before any write token
        env:
          GATE_READ_TOKEN: ${{ steps.recheck-token.outputs.token }}
        run: python3 -I scripts/merge_gate.py premerge

      - name: Mint merge token for the target repository only
        id: write-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ secrets.FARADAY_APP_ID }}
          private-key: ${{ secrets.FARADAY_APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}
          repositories: ${{ needs.gate.outputs.repo_name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Merge exactly the gated head
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          RECHECK_TOKEN: ${{ steps.recheck-token.outputs.token }}
        run: |
          set -euo pipefail
          # Immediately before merging, re-read live: kill switch (policy + ADR on main), policy
          # version, grant expiry, PR open/non-draft/same head/same-repo, base == default branch,
          # and default-branch tip == the signed base SHA. Any change refuses (exit 3).
          GATE_READ_TOKEN="${RECHECK_TOKEN}" python3 -I scripts/merge_gate.py premerge
          title="faraday-ci-bot merge (gate v1, mode=${IN_MODE}, run=${GITHUB_RUN_ID})"
          gh api -X PUT "repos/${IN_OWNER}/${IN_REPO_NAME}/pulls/${IN_PR}/merge" \
            -f sha="${IN_SHA}" -f merge_method="${IN_METHOD}" \
            -f commit_title="${title}" \
            -f commit_message="faraday-merge-gate:v1 head=${IN_SHA} base=${IN_BASE_SHA} expires=${IN_EXPIRES_AT} decision_sha256=${IN_DECISION_SHA256} gate_commit=${GITHUB_SHA} mode=${IN_MODE} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > merge.json
          echo "### merged ${IN_OWNER}/${IN_REPO_NAME}#${IN_PR} at ${IN_SHA}" >> "$GITHUB_STEP_SUMMARY"
          cat merge.json >> "$GITHUB_STEP_SUMMARY"
